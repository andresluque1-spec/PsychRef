function QuestionnaireRunner({ q, onBack }) {
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const total = Object.values(answers).reduce((s,v)=>s+v,0);
  const allAnswered = q.questions.length===Object.keys(answers).length;
  const band = q.scoring.find(s=>total>=s.range[0]&&total<=s.range[1]);
  const bandColor = (label)=>{
    if(!label)return"#64748b";
    if(label.toLowerCase().includes("severe")||label.toLowerCase().includes("depend")||label.toLowerCase().includes("positive"))return"#f87171";
    if(label.toLowerCase().includes("moderate"))return"#f59e0b";
    if(label.toLowerCase().includes("mild"))return"#fde68a";
    return"#22c55e";
  };
  return (
    <div>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#38bdf8",cursor:"pointer",fontSize:"0.875rem",marginBottom:"24px",display:"flex",alignItems:"center",gap:"6px",padding:0}}>← Back to questionnaires</button>
      <h2 style={{color:"#e2e8f0",fontSize:"1.3rem",fontWeight:700,marginBottom:"4px"}}>{q.name} — {q.fullName}</h2>
      <div style={{color:"#64748b",fontSize:"0.85rem",marginBottom:"8px"}}>Target: {q.target} · Timeframe: {q.timeframe}</div>
      {q.note&&<div style={{background:"#0a0e17",border:"1px solid #1e2d45",borderRadius:"8px",padding:"12px",marginBottom:"24px",color:"#94a3b8",fontSize:"0.82rem",lineHeight:1.6}}>ℹ {q.note}</div>}
      {!done?(
        <div>
          {q.questions.map((question,i)=>(
            <div key={i} style={{background:"#0a0e17",border:`1px solid ${answers[i]!==undefined?"#1e3a5f":"#1e293b"}`,borderRadius:"10px",padding:"16px",marginBottom:"12px"}}>
              <div style={{color:"#cbd5e1",fontSize:"0.88rem",marginBottom:"14px",lineHeight:1.6}}>
                <span style={{color:"#38bdf8",fontWeight:700,marginRight:"8px"}}>{i+1}.</span>{question}
              </div>
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                {(q.maxPerQuestion ? q.options.filter((opt,j)=>q.optionValues[j]<=q.maxPerQuestion[i]) : q.options).map((opt,j)=>(
                  <button key={j} onClick={()=>setAnswers(prev=>({...prev,[i]:q.optionValues[j]}))}
                    style={{background:answers[i]===q.optionValues[j]?"#0ea5e9":"#0f1724",border:`1px solid ${answers[i]===q.optionValues[j]?"#0ea5e9":"#2d3748"}`,color:answers[i]===q.optionValues[j]?"#fff":"#94a3b8",borderRadius:"8px",padding:"6px 12px",fontSize:"0.78rem",cursor:"pointer"}}>
                    {opt}
                  </button>
                ))}
              </div>
            </div>
          ))}
          {allAnswered&&<button onClick={()=>setDone(true)} style={{width:"100%",background:"#0ea5e9",border:"none",color:"#fff",borderRadius:"10px",padding:"14px",fontSize:"1rem",fontWeight:700,cursor:"pointer",marginTop:"8px"}}>View Score & Interpretation</button>}
        </div>
      ):(
        <div>
          <div style={{background:"#0a0e17",border:`2px solid ${bandColor(band?.label)}40`,borderRadius:"16px",padding:"32px",textAlign:"center",marginBottom:"24px"}}>
            <div style={{color:"#64748b",fontSize:"0.8rem",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"8px"}}>Total Score</div>
            <div style={{fontSize:"4rem",fontWeight:800,color:bandColor(band?.label),lineHeight:1}}>{total}</div>
            <div style={{color:"#e2e8f0",fontSize:"1.2rem",fontWeight:700,marginTop:"12px"}}>{band?.label}</div>
            <div style={{color:"#94a3b8",fontSize:"0.85rem",marginTop:"8px",lineHeight:1.6}}>{band?.action}</div>
          </div>
          <div style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",padding:"20px",marginBottom:"16px"}}>
            <div style={{color:"#64748b",fontSize:"0.75rem",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"14px"}}>Scoring Ranges</div>
            {q.scoring.map((s,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<q.scoring.length-1?"1px solid #1e293b":"none"}}>
                <span style={{color:"#94a3b8",fontSize:"0.82rem"}}>{s.range[0]}–{s.range[1]}</span>
                <span style={{color:bandColor(s.label),fontWeight:band?.label===s.label?700:400,fontSize:"0.82rem"}}>{s.label}</span>
                <span style={{color:"#64748b",fontSize:"0.75rem",maxWidth:"200px",textAlign:"right"}}>{s.action}</span>
              </div>
            ))}
          </div>
          <button onClick={()=>{setAnswers({});setDone(false);}} style={{background:"#1e293b",border:"1px solid #2d3748",color:"#94a3b8",borderRadius:"10px",padding:"12px 24px",cursor:"pointer",fontSize:"0.875rem"}}>Retake</button>
        </div>
      )}
    </div>
  );
}

function FDAModule() {
  const [search, setSearch] = useState("");
  const [view, setView] = useState("diagnosis");
  const [expanded, setExpanded] = useState({});
  const toggle=(key)=>setExpanded(prev=>({...prev,[key]:!prev[key]}));
  const filteredDiag = useMemo(()=>{
    const q=search.toLowerCase();
    if(!q)return FDA_INDICATIONS;
    const result={};
    Object.entries(FDA_INDICATIONS).forEach(([diag,meds])=>{
      if(diag.toLowerCase().includes(q)||meds.some(m=>m.toLowerCase().includes(q)))result[diag]=meds;
    });
    return result;
  },[search]);
  const byMed = useMemo(()=>{
    const result={};
    Object.entries(FDA_INDICATIONS).forEach(([diag,meds])=>{
      meds.forEach(med=>{if(!result[med])result[med]=[];result[med].push(diag);});
    });
    return result;
  },[]);
  const filteredMed = useMemo(()=>{
    const q=search.toLowerCase();
    if(!q)return byMed;
    const result={};
    Object.entries(byMed).forEach(([med,diags])=>{
      if(med.toLowerCase().includes(q)||diags.some(d=>d.toLowerCase().includes(q)))result[med]=diags;
    });
    return result;
  },[search,byMed]);
  return (
    <div>
      <div style={{display:"flex",gap:"12px",marginBottom:"16px",flexWrap:"wrap"}}>
        <div style={{position:"relative",flex:1,minWidth:"200px"}}>
          <div style={{position:"absolute",left:"14px",top:"50%",transform:"translateY(-50%)",color:"#475569"}}><SearchIcon/></div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search diagnosis or medication..."
            style={{width:"100%",background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",padding:"11px 12px 11px 44px",color:"#e2e8f0",fontSize:"0.875rem",outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div style={{display:"flex",background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",overflow:"hidden"}}>
          {["diagnosis","medication"].map(v=>(
            <button key={v} onClick={()=>setView(v)}
              style={{background:view===v?"#0ea5e9":"transparent",border:"none",color:view===v?"#fff":"#64748b",padding:"11px 18px",cursor:"pointer",fontSize:"0.82rem",fontWeight:view===v?700:400,textTransform:"capitalize"}}>
              By {v}
            </button>
          ))}
        </div>
      </div>
      {view==="diagnosis"?Object.entries(filteredDiag).map(([diag,meds])=>(
        <div key={diag} style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",marginBottom:"10px",overflow:"hidden"}}>
          <div onClick={()=>toggle(diag)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 20px",cursor:"pointer"}}>
            <span style={{color:"#e2e8f0",fontWeight:600,fontSize:"0.9rem"}}>{diag}</span>
            <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
              <span style={{color:"#475569",fontSize:"0.78rem"}}>{meds.length} agents</span>
              <div style={{color:"#475569",transform:expanded[diag]?"rotate(180deg)":"none",transition:"transform 0.2s"}}><ChevronDown/></div>
            </div>
          </div>
          {expanded[diag]&&<div style={{padding:"0 20px 16px",display:"flex",flexWrap:"wrap",gap:"6px"}}>
            {meds.map(med=>(<span key={med} style={{background:"#0ea5e915",border:"1px solid #0ea5e930",color:"#7dd3fc",borderRadius:"6px",padding:"4px 12px",fontSize:"0.8rem"}}>{med}</span>))}
          </div>}
        </div>
      )):Object.entries(filteredMed).sort(([a],[b])=>a.localeCompare(b)).map(([med,diags])=>(
        <div key={med} style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",marginBottom:"10px",overflow:"hidden"}}>
          <div onClick={()=>toggle(med)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 20px",cursor:"pointer"}}>
            <span style={{color:"#e2e8f0",fontWeight:600,fontSize:"0.9rem"}}>{med}</span>
            <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
              <span style={{color:"#475569",fontSize:"0.78rem"}}>{diags.length} indication{diags.length!==1?"s":""}</span>
              <div style={{color:"#475569",transform:expanded[med]?"rotate(180deg)":"none",transition:"transform 0.2s"}}><ChevronDown/></div>
            </div>
          </div>
          {expanded[med]&&<div style={{padding:"0 20px 16px",display:"flex",flexWrap:"wrap",gap:"6px"}}>
            {diags.map(d=>(<span key={d} style={{background:"#16213a",color:"#94a3b8",borderRadius:"6px",padding:"4px 12px",fontSize:"0.8rem"}}>{d}</span>))}
          </div>}
        </div>
      ))}
    </div>
  );
}

        <div style={{position:"absolute",left:"14px",top:"50%",transform:"translateY(-50%)",color:"#475569"}}><SearchIcon/></div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search diagnoses..."
          style={{width:"100%",background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",padding:"12px 12px 12px 44px",color:"#e2e8f0",fontSize:"0.9rem",outline:"none",boxSizing:"border-box"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:"12px"}}>
        {filtered.map(d=>(
          <div key={d.id} onClick={()=>setActive(d)}
            style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",padding:"20px",cursor:"pointer",transition:"border-color 0.15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="#a78bfa"}
            onMouseLeave={e=>e.currentTarget.style.borderColor="#1e293b"}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
              <div style={{color:"#e2e8f0",fontWeight:700,fontSize:"0.95rem"}}>{d.name}</div>
              <ChevronRight/>
            </div>
            <div style={{color:"#64748b",fontSize:"0.75rem",marginBottom:"12px"}}>{d.dsm}</div>
            <div style={{color:"#94a3b8",fontSize:"0.78rem",lineHeight:1.6,marginBottom:"12px"}}>{d.criteria.slice(0,100)}…</div>
            <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
              <span style={{background:"#1e293b",color:"#64748b",borderRadius:"5px",padding:"2px 8px",fontSize:"0.7rem"}}>{d.domains.length} domains</span>
              <span style={{background:"#1e293b",color:"#64748b",borderRadius:"5px",padding:"2px 8px",fontSize:"0.7rem"}}>{d.differentials.length} differentials</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const NOTES_KEY = "psychref_notes_v1";
const NOTES_CATEGORIES = ["Clinical Pearl","Drug Interaction","Dosing Note","Patient Tip","Red Flag","Protocol Update","Personal Reminder","Case Insight"];
const CAT_COLORS = {"Clinical Pearl":"#38bdf8","Drug Interaction":"#f87171","Dosing Note":"#a78bfa","Patient Tip":"#22c55e","Red Flag":"#ef4444","Protocol Update":"#f59e0b","Personal Reminder":"#64748b","Case Insight":"#34d399"};

function loadNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_KEY)||"[]"); } catch { return []; }
}
function saveNotes(notes) {
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch {}
}

function LabDetail({ protocol, onBack }) {
  const [openPanel, setOpenPanel] = useState(0);
  const [tab, setTab] = useState("panels");
  return (
    <div>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#38bdf8",cursor:"pointer",fontSize:"0.875rem",marginBottom:"24px",display:"flex",alignItems:"center",gap:"6px",padding:0}}>← Back to lab protocols</button>
      <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"8px"}}>
        <h2 style={{color:"#e2e8f0",fontSize:"1.3rem",fontWeight:700,margin:0}}>{protocol.name}</h2>
        <span style={{background:`${protocol.color}20`,border:`1px solid ${protocol.color}40`,color:protocol.color,borderRadius:"6px",padding:"3px 10px",fontSize:"0.75rem",fontWeight:600}}>{protocol.category}</span>
      </div>
      <div style={{color:"#64748b",fontSize:"0.82rem",marginBottom:"20px",lineHeight:1.6}}>{protocol.rationale}</div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"10px",marginBottom:"20px"}}>
        {[
          ["Therapeutic Range",protocol.therapeuticRange,"#22c55e"],
          ["Toxicity / Alarm Level",protocol.toxicityLevel,"#f87171"],
          ["Timing Note",protocol.timingNote,"#f59e0b"],
        ].map(([label,val,col])=>(
          <div key={label} style={{background:"#0a0e17",border:`1px solid ${col}25`,borderRadius:"10px",padding:"12px"}}>
            <div style={{color:col,fontSize:"0.7rem",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:"6px"}}>{label}</div>
            <div style={{color:"#cbd5e1",fontSize:"0.78rem",lineHeight:1.6}}>{val}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex",gap:"4px",marginBottom:"16px",background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",padding:"4px",width:"fit-content"}}>
        {["panels","interactions","counseling"].map(t=>(
          <button key={t} onClick={()=>setTab(t)}
            style={{background:tab===t?"#1e293b":"transparent",border:"none",color:tab===t?"#e2e8f0":"#64748b",borderRadius:"7px",padding:"8px 16px",cursor:"pointer",fontSize:"0.8rem",fontWeight:tab===t?600:400,textTransform:"capitalize"}}>
            {t==="panels"?"Monitoring Panels":t==="interactions"?"Drug Interactions":"Patient Counseling"}

        ))}
      </div>

      {tab==="panels"&&protocol.panels.map((panel,i)=>(
        <div key={i} style={{background:"#0a0e17",border:`1px solid ${openPanel===i?protocol.color+"50":"#1e293b"}`,borderRadius:"12px",marginBottom:"10px",overflow:"hidden"}}>
          <div onClick={()=>setOpenPanel(openPanel===i?-1:i)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",cursor:"pointer"}}>
            <span style={{color:openPanel===i?protocol.color:"#cbd5e1",fontWeight:600,fontSize:"0.875rem"}}>{panel.name}</span>
            <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
              <span style={{color:"#475569",fontSize:"0.72rem"}}>{panel.tests.length} tests/checks</span>
              <div style={{color:"#475569",transform:openPanel===i?"rotate(180deg)":"none",transition:"transform 0.2s"}}>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
          </div>
          {openPanel===i&&(
            <div style={{padding:"0 18px 16px"}}>
              {panel.tests.map((item,j)=>(
                <div key={j} style={{display:"grid",gridTemplateColumns:"220px 1fr",gap:"12px",padding:"10px 0",borderTop:"1px solid #1e293b",alignItems:"start"}}>
                  <div style={{color:protocol.color,fontWeight:600,fontSize:"0.82rem",paddingTop:"1px"}}>{item.test}</div>
                  <div style={{color:"#94a3b8",fontSize:"0.82rem",lineHeight:1.6}}>{item.reason}</div>

          )}

      {tab==="interactions"&&(
        <div style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",padding:"20px"}}>
          <div style={{color:"#f87171",fontSize:"0.75rem",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:"14px"}}>Key Drug Interactions</div>
          {protocol.ddis.map((ddi,i)=>(
            <div key={i} style={{display:"flex",gap:"10px",padding:"10px 0",borderBottom:i<protocol.ddis.length-1?"1px solid #1e293b":"none",alignItems:"flex-start"}}>

              <div style={{color:"#cbd5e1",fontSize:"0.85rem",lineHeight:1.6}}>{ddi}</div>

          ))}
        </div>
      )}

      {tab==="counseling"&&(
        <div style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",padding:"20px"}}>
          <div style={{color:"#22c55e",fontSize:"0.75rem",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:"14px"}}>Patient Counseling Points</div>
          {protocol.patientCounseling.map((point,i)=>(
            <div key={i} style={{display:"flex",gap:"10px",padding:"10px 0",borderBottom:i<protocol.patientCounseling.length-1?"1px solid #1e293b":"none",alignItems:"flex-start"}}>
              <div style={{color:"#22c55e",fontSize:"0.875rem",marginTop:"1px"}}>✓</div>
              <div style={{color:"#cbd5e1",fontSize:"0.85rem",lineHeight:1.6}}>{point}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function NotesModule() {
  const [notes, setNotes] = useState(()=>loadNotes());
  const [view, setView] = useState("list"); // list | new | detail
  const [selected, setSelected] = useState(null);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("All");
  const [form, setForm] = useState({title:"",category:"Clinical Pearl",tags:"",body:"",ref:""});
  const [editId, setEditId] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const persist = (updated) => { setNotes(updated); saveNotes(updated); };

  const handleSave = () => {
    if(!form.title.trim()||!form.body.trim())return;
    const tags = form.tags.split(",").map(t=>t.trim()).filter(Boolean);
    if(editId!==null){
      const updated = notes.map(n=>n.id===editId?{...n,...form,tags,updated:new Date().toISOString()}:n);
      persist(updated); setView("list"); setEditId(null);
    } else {
      const newNote = {id:Date.now(),title:form.title,category:form.category,tags,body:form.body,ref:form.ref,created:new Date().toISOString(),updated:new Date().toISOString()};
      persist([newNote,...notes]); setView("list");
    }
    setForm({title:"",category:"Clinical Pearl",tags:"",body:"",ref:""});
  };

  const handleEdit = (note) => {
    setForm({title:note.title,category:note.category,tags:note.tags.join(", "),body:note.body,ref:note.ref||""});
    setEditId(note.id); setView("new");
  };

  const handleDelete = (id) => {
    persist(notes.filter(n=>n.id!==id));
    setConfirmDelete(null); setView("list"); setSelected(null);
  };

  const filtered = useMemo(()=>{
    const q=search.toLowerCase();
    return notes.filter(n=>{
      const matchCat=catFilter==="All"||n.category===catFilter;
      const matchSearch=!q||n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q)||n.tags.some(t=>t.toLowerCase().includes(q));
      return matchCat&&matchSearch;
    });
  },[notes,search,catFilter]);

  const fmtDate = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  };

  const inputStyle = {width:"100%",background:"#070b14",border:"1px solid #1e293b",borderRadius:"8px",padding:"10px 12px",color:"#e2e8f0",fontSize:"0.875rem",outline:"none",boxSizing:"border-box",fontFamily:"inherit"};

  if(view==="new") return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"24px"}}>
        <h2 style={{color:"#e2e8f0",fontSize:"1.2rem",fontWeight:700,margin:0}}>{editId!==null?"Edit Note":"New Note"}</h2>

      </div>
      <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
        <div>
          <label style={{color:"#64748b",fontSize:"0.75rem",textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:"6px"}}>Title *</label>
          <input value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))} placeholder="e.g. Lithium + NSAID interaction pearl" style={inputStyle}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
          <div>
            <label style={{color:"#64748b",fontSize:"0.75rem",textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:"6px"}}>Category</label>

              style={{...inputStyle,appearance:"none",cursor:"pointer"}}>

            <input value={form.tags} onChange={e=>setForm(p=>({...p,tags:e.target.value}))} placeholder="lithium, renal, elderly" style={inputStyle}/>
          </div>
        </div>
        <div>
          <label style={{color:"#64748b",fontSize:"0.75rem",textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:"6px"}}>Note / Content *</label>
          <textarea value={form.body} onChange={e=>setForm(p=>({...p,body:e.target.value}))} placeholder="Write your clinical pearl, observation, protocol note, or reminder here..."
            rows={8} style={{...inputStyle,resize:"vertical",lineHeight:1.7}}/>
        </div>
        <div>
          <label style={{color:"#64748b",fontSize:"0.75rem",textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:"6px"}}>Reference / Source (optional)</label>

            {editId!==null?"Save Changes":"Save Note"}
          </button>
        </div>
      </div>
    </div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",flexWrap:"wrap",gap:"10px"}}>
          <div style={{flex:1}}>
            <h2 style={{color:"#e2e8f0",fontSize:"1.25rem",fontWeight:700,margin:"0 0 8px 0"}}>{note.title}</h2>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
              <span style={{background:`${catColor}20`,border:`1px solid ${catColor}40`,color:catColor,borderRadius:"6px",padding:"3px 10px",fontSize:"0.75rem",fontWeight:600}}>{note.category}</span>
              {note.tags.map(t=>(<span key={t} style={{background:"#1e293b",color:"#64748b",borderRadius:"5px",padding:"2px 8px",fontSize:"0.72rem"}}>#{t}</span>))}
            </div>
          </div>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={()=>handleEdit(note)} style={{background:"#1e293b",border:"none",color:"#94a3b8",borderRadius:"8px",padding:"8px 14px",cursor:"pointer",fontSize:"0.82rem"}}>Edit</button>
            <button onClick={()=>setConfirmDelete(note.id)} style={{background:"#2a0a0a",border:"1px solid #7f1d1d40",color:"#f87171",borderRadius:"8px",padding:"8px 14px",cursor:"pointer",fontSize:"0.82rem"}}>Delete</button>
          </div>
        </div>
        <div style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",padding:"24px",marginBottom:"16px",color:"#cbd5e1",fontSize:"0.9rem",lineHeight:1.85,whiteSpace:"pre-wrap"}}>

      </div>

            <button key={c} onClick={()=>setCatFilter(c)}

              {c}
            </button>
          );
        })}
      </div>

      {filtered.length===0&&(

          <div style={{fontSize:"2rem",marginBottom:"12px"}}>📝</div>

        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:"12px"}}>
        {filtered.map(note=>{

          return (
            <div key={note.id} onClick={()=>{setSelected(note.id);setView("detail");}}
              style={{background:"#0a0e17",border:`1px solid #1e293b`,borderLeft:`3px solid ${col}`,borderRadius:"12px",padding:"16px",cursor:"pointer",transition:"border-color 0.15s"}}

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>

                <div style={{color:"#334155",fontSize:"0.7rem"}}>{fmtDate(note.updated)}</div>
              </div>
              <div style={{color:"#e2e8f0",fontWeight:600,fontSize:"0.9rem",marginBottom:"8px",lineHeight:1.4}}>{note.title}</div>

            </div>

        })}
      </div>
      {notes.length>0&&<div style={{marginTop:"20px",color:"#334155",fontSize:"0.75rem",textAlign:"center"}}>{notes.length} note{notes.length!==1?"s":""} · Stored locally in this browser</div>}
    </div>
  );
}

function AugDetail({ dx, onBack }) {

    if(!ev) return "#475569";
    if(ev.includes("FDA-approved")) return "#22c55e";
    if(ev.includes("Level A")) return "#22c55e";
    if(ev.includes("Level B")) return "#38bdf8";
    if(ev.includes("Level C")) return "#f59e0b";
    if(ev.includes("Clinical imperative")) return "#a78bfa";
    if(ev.includes("First-line")) return "#22c55e";
    return "#475569";
  };
  return (
    <div>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#38bdf8",cursor:"pointer",fontSize:"0.875rem",marginBottom:"24px",display:"flex",alignItems:"center",gap:"6px",padding:0}}>← Back</button>

// ─── AUTO-GENERATED PER-MEDICATION PATIENT HANDOUTS ───────────────────────────
// Builds a printable, patient-friendly handout for every medication in
// MEDICATIONS, reusing the clinical facts already curated there so content
// stays accurate and stays in sync if a medication entry is edited.

function classSafetyGuidance(med) {
  const c = med.class.toLowerCase();
  const extraSafety = [];
  const extraWarnings = [];

  if (c.includes("benzodiazepine") || c.includes("z-drug")) {
    extraSafety.push("This medication can cause physical dependence with regular use. Do not combine it with alcohol or opioid pain medications — this combination can slow or stop breathing and can be fatal. Avoid driving or operating machinery until you know how it affects you.");
    extraWarnings.push("Do not stop this medication abruptly after regular use — stopping suddenly can cause withdrawal symptoms or seizures. Any dose reduction should be tapered slowly under your provider's guidance.");
  }
  if (c.includes("stimulant") && !c.includes("non-stimulant")) {
    extraSafety.push("This is a controlled substance with potential for misuse. Store it securely, do not share it with anyone, and take it exactly as prescribed. Avoid dosing late in the day, as it can interfere with sleep.");
    extraWarnings.push("Seek prompt medical care for chest pain, fainting, shortness of breath, or a racing/irregular heartbeat. Tell your provider about any personal or family history of heart problems.");
  }
  // Opioid-related classes need to be told apart carefully: "antagonist" contains the
  // literal substring "agonist", and antagonists (e.g. naltrexone, naloxone) have the
  // opposite risk profile from agonists (e.g. methadone, buprenorphine) — mixing up the
  // guidance here would be a real patient-safety error, not just a wording issue.
  const isOpioidAgonist = /opioid agonist/i.test(med.class);
  const isOverdoseReversal = /overdose reversal/i.test(med.class);
  const isOpioidAntagonistOnly = !isOpioidAgonist && /opioid antagonist/i.test(med.class);
  if (isOpioidAgonist) {
    extraSafety.push("This medication carries a risk of dependence and, in overdose, can be fatal. Never combine it with alcohol, benzodiazepines, or other sedatives without your provider's explicit approval. Store it securely and do not share it.");
    extraWarnings.push("Seek emergency care for slow or difficult breathing, extreme drowsiness, blue lips or fingertips, or unresponsiveness.");
  } else if (isOverdoseReversal) {
    extraSafety.push("This medication is used to reverse a suspected opioid overdose in an emergency — it is not taken on a regular schedule. Keep it accessible to household members or others who may need to use it, and make sure they know how.");
    extraWarnings.push("Call 911 immediately after giving this medication, even if the person seems to recover — overdose effects can return once it wears off.");
  } else if (isOpioidAntagonistOnly) {
    extraSafety.push("This medication blocks the effects of opioids and is not itself an opioid — it does not cause dependence. You generally must be opioid-free for a period your provider specifies before starting it, and you should avoid using opioids while taking it.");
    extraWarnings.push("Carry or wear medical identification noting that you take this medication — it changes how opioid pain medications and opioid-overdose treatment work if you ever need them in an emergency.");
  }
  if (c.includes("antipsychotic")) {
    extraSafety.push("This medication may require periodic monitoring of your weight, blood sugar, and cholesterol. Keep your scheduled lab and follow-up appointments.");
    extraWarnings.push("Seek emergency care for high fever, severe muscle stiffness, confusion, or a fast/irregular heartbeat (rare, but can signal a medical emergency called neuroleptic malignant syndrome). Tell your provider about any new, uncontrollable movements of the face, tongue, or limbs — this can be a sign of tardive dyskinesia.");
  }
  if (c.includes("tricyclic")) {
    extraSafety.push("This medication can be dangerous in overdose. Store it securely, keep it away from children, and take only your prescribed amount.");
    extraWarnings.push("Seek care for irregular heartbeat, fainting, or severe dizziness when standing up.");
  }
  if (med.name.toLowerCase() === "lithium") {
    extraSafety.push("Stay consistently hydrated and keep your salt intake steady — dehydration and low sodium can raise lithium levels to unsafe amounts. Avoid NSAIDs (ibuprofen, naproxen) unless your provider approves. Routine blood levels and kidney/thyroid monitoring are required.");
    extraWarnings.push("Seek immediate care for signs of toxicity: persistent vomiting or diarrhea, severe tremor, confusion, slurred speech, or loss of coordination.");
  }
  if (c.includes("maoi")) {
    extraSafety.push("Certain foods high in tyramine (aged cheeses, cured or fermented meats, tap beer, soy sauce) and many other medications can cause a dangerous blood pressure spike. Ask your provider or pharmacist for a full dietary and medication list before starting.");
  }

  return { extraSafety, extraWarnings };
}

function expectationText(med) {
  const c = med.class.toLowerCase();
  if ((c.includes("stimulant") && !c.includes("non-stimulant")) || c.includes("wakefulness")) {
    return "This medication typically begins working within 30–60 minutes of a dose, with effects lasting several hours depending on the specific formulation. Talk to your provider about timing doses around your daily schedule.";
  }
  if (c.includes("benzodiazepine") || c.includes("z-drug") || c.includes("orexin") || c.includes("melatonin")) {
    return "This medication usually takes effect within 30–60 minutes. Depending on what it's prescribed for, your provider may intend it for short-term, as-needed, or ongoing use — ask which applies to you.";
  }
  if (c.includes("antipsychotic")) {
    return "Calming or sedating effects may be noticeable within hours to days. Full benefit for mood, psychotic, or other target symptoms can take 1–6 weeks of consistent use — don't judge effectiveness too early.";
  }
  if (/(ssri|snri|tricyclic|nassa|ndri|spari|sari|mood stabilizer|anticonvulsant|maoi)/.test(c)) {
    return "Side effects often show up before benefits do — this is normal and usually temporary. Full benefit for mood or anxiety symptoms typically takes 2–8 weeks of consistent use. Partial improvement earlier is a good sign — keep taking it and stay in touch with your provider.";
  }
  return "Ask your provider what timeline to expect for this specific medication — some medications act within hours, while others take days to weeks to reach full effect.";
}

function buildMedHandout(med) {
  const { extraSafety, extraWarnings } = classSafetyGuidance(med);
  const sections = [];

  sections.push({
    heading: "What this medication is and why it's prescribed",
    content: `${med.name} (brand name: ${med.brand}) is classified as a ${med.class.replace(/\s*\(.*?\)\s*/g," ").trim()} medication. Your provider prescribes it based on your specific diagnosis and history — not every use listed below will apply to you.`,
  });

  sections.push({ heading: "FDA-approved uses", bullets: med.fdaUses });

  if (med.offLabel && med.offLabel.length) {
    sections.push({
      heading: "Other uses your provider may prescribe it for",
      content: "Your provider may prescribe this medication for a condition not officially listed on the FDA label, based on clinical evidence and your individual situation. This is a common and accepted practice in psychiatry.",
      bullets: med.offLabel,
    });
  }

  sections.push({
    heading: "How to take it",
    bullets: [
      `Typical dosing range: ${med.dosing}. Your provider will set your specific starting and target dose — do not adjust it on your own.`,
      "Take it at the same time each day, exactly as prescribed.",
      "If you miss a dose, take it as soon as you remember unless it's almost time for your next dose — do not double up.",
      "Do not stop this medication on your own, even if you feel better or feel it isn't helping — talk to your provider first.",
      ...extraSafety,
    ],
  });

  sections.push({ heading: "What to expect", content: expectationText(med) });

  sections.push({ heading: "Common side effects", bullets: med.sideEffects });

  sections.push({
    heading: "Warning signs — contact your provider or seek care",
    content: med.safety,
    bullets: [
      "New or worsening thoughts of self-harm or suicide — call or text 988 (Suicide & Crisis Lifeline) or go to the nearest emergency room.",
      "Signs of a severe allergic reaction: rash, swelling of the face or throat, difficulty breathing.",
      ...extraWarnings,
    ],
  });

  if (med.interactions && med.interactions.length) {
    sections.push({
      heading: "Medications and substances to be careful with",
      content: "Tell every prescriber, dentist, and pharmacist that you take this medication. Do not start a new prescription, over-the-counter medication, or supplement without checking first.",
      bullets: med.interactions,
    });
  }

  if (med.pregnancy) {
    sections.push({
      heading: "Pregnancy & breastfeeding",
      content: `${med.pregnancy}. If you are pregnant, breastfeeding, or planning a pregnancy, discuss the risks and benefits with your provider — do not stop this medication on your own.`,
    });
  }

  return {
    id: `med-${med.id}`,
    category: "Medication Education",
    lang: "en",
    title: `${med.name} (${med.brand}) — Patient Medication Guide`,
    subtitle: `${med.class} · What to know before you start`,
    color: "#22c55e",
    sections,
  };
}

const MED_HANDOUTS = MEDICATIONS.map(buildMedHandout);
const ALL_HANDOUTS = [...HANDOUTS, ...MED_HANDOUTS];

// ─── INTERACTION CHECKER — RISK-TAG HEURISTICS ────────────────────────────────
// These tags are derived from fields already curated per medication (class,
// side effects, interactions, safety notes) — not a separate pharmacology
// database. They flag ADDITIVE/CLASS-LEVEL risk (e.g. two serotonergic drugs
// together) so a reviewer can spot burden at a glance. They intentionally do
// NOT attempt CYP450 or other pharmacokinetic interaction modeling, since that
// data isn't part of this dataset — see the disclaimer in the module itself.

const RISK_TAGS = {
  serotonergic: { label: "Serotonergic", color: "#f87171", note: "Combining serotonergic agents raises the risk of serotonin syndrome (agitation, tremor, hyperreflexia, autonomic instability). Risk is highest at initiation, dose increases, or when adding a new serotonergic agent to an existing one." },
  qtc: { label: "QTc-Prolonging", color: "#fb923c", note: "Combining QTc-prolonging agents has an additive effect on cardiac repolarization. Consider baseline/interval ECG monitoring, especially with other cardiac risk factors, electrolyte abnormalities, or higher doses." },
  sedating: { label: "Sedating / CNS-Depressant", color: "#a78bfa", note: "Combining sedating agents increases fall risk, cognitive slowing, and respiratory depression risk (especially with opioids or alcohol). Use particular caution in elderly patients." },
  anticholinergic: { label: "Anticholinergic", color: "#38bdf8", note: "Anticholinergic burden is cumulative — combining these agents increases risk of confusion, constipation, urinary retention, dry mouth, and (especially in older adults) cognitive impairment and delirium." },
};

function medRiskTags(med) {
  const c = med.class.toLowerCase();
  const blob = (med.safety + " " + med.interactions.join(" ") + " " + med.sideEffects.join(" ")).toLowerCase();
  const isOpioidAgonist = /opioid agonist/i.test(med.class);
  const isSedatingClass = /benzodiazepine|z-drug|orexin|antihistamine/.test(c) || (c.includes("melatonin") && !c.includes("non-"));
  const anticholinergicHits = ["dry mouth", "constipation", "urinary retention", "blurred vision"].filter(s => blob.includes(s)).length;
  return {
    serotonergic: blob.includes("serotonin") || /\bssri\b|\bsnri\b|tricyclic|\bsari\b|nassa|spari|azapirone/.test(c),
    qtc: blob.includes("qtc"),
    sedating: isSedatingClass || blob.includes("sedation") || blob.includes("somnolence") || blob.includes("drowsiness") || /benzodiazepine|z-drug/.test(c) || isOpioidAgonist,
    anticholinergic: c.includes("tricyclic") || anticholinergicHits >= 2,
  };
}

function printHandoutWindow(handout) {
  const esc = s => String(s).replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let body = "";
  handout.sections.forEach(sec => {
    body += `<h2 style="color:${handout.color};font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px">${esc(sec.heading)}</h2>`;
    if (sec.content) body += `<p style="margin:0 0 10px;line-height:1.7">${esc(sec.content)}</p>`;
    if (sec.steps) { body += "<ol style='padding-left:22px;margin:0 0 10px'>"; sec.steps.forEach(s=>body+=`<li style="margin-bottom:6px;line-height:1.7">${esc(s)}</li>`); body += "</ol>"; }
    if (sec.bullets) { body += "<ul style='padding-left:22px;margin:0 0 10px'>"; sec.bullets.forEach(b=>body+=`<li style="margin-bottom:5px;line-height:1.7">${esc(b)}</li>`); body += "</ul>"; }
  });
  const footer = handout.lang==="es"
    ? "Proporcionado por Andres Luque, PMHNP-BC \u00b7 Psychiatry of the Palm Beaches \u2014 Folleto educativo, no sustituye su plan de tratamiento."
    : "Provided by Andres Luque, PMHNP-BC \u00b7 Psychiatry of the Palm Beaches \u2014 Educational handout, not a substitute for your treatment plan.";
  const w = window.open("", "_blank");
  if (!w) { alert("Please allow pop-ups for this site to print handouts."); return; }
  w.document.write(`<html><head><title>${esc(handout.title)}</title><style>@page{margin:1.6cm}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1e293b;max-width:720px;margin:auto;padding:8px}h1{font-size:22px;margin:0 0 4px}.sub{color:#64748b;font-size:14px;margin-bottom:18px}.hd{border-bottom:3px solid ${handout.color};padding-bottom:14px;margin-bottom:8px}.ft{border-top:1px solid #e2e8f0;margin-top:26px;padding-top:12px;color:#94a3b8;font-size:12px}</style></head><body><div class="hd"><h1>${esc(handout.title)}</h1><div class="sub">${esc(handout.subtitle)}</div></div>${body}<div class="ft">${esc(footer)}</div></body></html>`);
  w.document.close();
  w.focus();
  setTimeout(()=>{ w.print(); w.close(); }, 350);
}

function InteractionCheckerModule() {
  const [selectedIds, setSelectedIds] = useState([]);
  const [search, setSearch] = useState("");

  const selected = selectedIds.map(id => MEDICATIONS.find(m => m.id === id)).filter(Boolean);

  const suggestions = useMemo(() => {
    const q = search.toLowerCase().trim();
    if (!q) return [];
    return MEDICATIONS.filter(m =>
      !selectedIds.includes(m.id) &&
      (m.name.toLowerCase().includes(q) || m.brand.toLowerCase().includes(q))
    ).slice(0, 8);
  }, [search, selectedIds]);

  const addMed = (id) => { setSelectedIds([...selectedIds, id]); setSearch(""); };
  const removeMed = (id) => setSelectedIds(selectedIds.filter(x => x !== id));

  const tagged = selected.map(m => ({ med: m, tags: medRiskTags(m) }));
  const burdens = Object.keys(RISK_TAGS).map(key => ({
    key,
    ...RISK_TAGS[key],
    meds: tagged.filter(t => t.tags[key]).map(t => t.med),
  })).filter(b => b.meds.length >= 2);

  return (
    <div>
      <div style={{background:"#1a0505",border:"1px solid #7f1d1d40",borderRadius:"10px",padding:"12px 16px",marginBottom:"20px",color:"#fca5a5",fontSize:"0.82rem",lineHeight:1.6}}>
        ⚠ This tool cross-references data already curated elsewhere in this app, plus basic pharmacologic-class heuristics (serotonergic, QTc, sedating, anticholinergic burden). It does <b>not</b> model CYP450 or other pharmacokinetic interactions, and it does not check against non-psychiatric medications. It's a screening aid to surface additive risk at a glance — not a substitute for a full interaction database (e.g. Lexicomp/Epocrates) or pharmacist review.
      </div>

      <div style={{marginBottom:"20px"}}>
        <div style={{position:"relative"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search a medication to add (e.g. sertraline, Zoloft)..."
            style={{width:"100%",background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",padding:"12px 14px",color:"#e2e8f0",fontSize:"0.875rem",outline:"none",boxSizing:"border-box"}}/>
          {suggestions.length > 0 && (
            <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#0f1724",border:"1px solid #1e293b",borderRadius:"10px",marginTop:"4px",zIndex:10,overflow:"hidden"}}>
              {suggestions.map(m => (
                <div key={m.id} onClick={()=>addMed(m.id)}
                  style={{padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid #1e293b"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#1e293b"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <span style={{color:"#e2e8f0",fontWeight:600,fontSize:"0.875rem"}}>{m.name}</span>
                  <span style={{color:"#64748b",fontSize:"0.78rem"}}> · {m.brand} · {m.class}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {selected.length > 0 && (
          <div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"12px"}}>
            {selected.map(m => (
              <div key={m.id} style={{display:"flex",alignItems:"center",gap:"8px",background:"#0ea5e920",border:"1px solid #0ea5e940",borderRadius:"20px",padding:"6px 8px 6px 14px"}}>
                <span style={{color:"#e2e8f0",fontSize:"0.82rem",fontWeight:600}}>{m.name}</span>
                <button onClick={()=>removeMed(m.id)} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:"1rem",lineHeight:1,padding:"2px 4px"}}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {selected.length === 0 && (
        <div style={{color:"#475569",fontSize:"0.85rem",padding:"20px 0"}}>Add two or more medications to check for shared-class risk and review each one's curated interaction list side by side.</div>
      )}

      {selected.length >= 2 && (
        <div style={{marginBottom:"28px"}}>
          <div style={{color:"#e2e8f0",fontSize:"1rem",fontWeight:700,marginBottom:"12px"}}>Shared-risk flags</div>
          {burdens.length === 0 && (
            <div style={{background:"#0a1a10",border:"1px solid #14532d40",borderRadius:"10px",padding:"12px 16px",color:"#86efac",fontSize:"0.82rem"}}>
              No shared-class risk burden detected among the selected medications by this tool's heuristics. This does not rule out an interaction — see the disclaimer above.
            </div>
          )}
          {burdens.map(b => (
            <div key={b.key} style={{background:"#0a0e17",border:`1px solid ${b.color}40`,borderLeft:`3px solid ${b.color}`,borderRadius:"10px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{color:b.color,fontWeight:700,fontSize:"0.9rem",marginBottom:"6px"}}>{b.label} burden — {b.meds.map(m=>m.name).join(", ")}</div>
              <div style={{color:"#cbd5e1",fontSize:"0.82rem",lineHeight:1.6}}>{b.note}</div>
            </div>
          ))}
        </div>
      )}

      {selected.length >= 1 && (
        <div>
          <div style={{color:"#e2e8f0",fontSize:"1rem",fontWeight:700,marginBottom:"12px"}}>Per-medication interactions &amp; safety notes</div>
          {selected.map(m => (
            <div key={m.id} style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"12px",padding:"16px",marginBottom:"12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"10px"}}>
                <div style={{color:"#e2e8f0",fontWeight:700,fontSize:"1rem"}}>{m.name} <span style={{color:"#64748b",fontWeight:400,fontSize:"0.8rem"}}>· {m.brand} · {m.class}</span></div>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"10px"}}>
                {m.interactions.map(item => (
                  <span key={item} style={{background:"#f8717115",border:"1px solid #f8717130",color:"#cbd5e1",borderRadius:"6px",padding:"3px 10px",fontSize:"0.78rem"}}>{item}</span>
                ))}
              </div>
              <div style={{color:"#94a3b8",fontSize:"0.8rem",lineHeight:1.6}}>{m.safety}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── OPENFDA DRUG LOOKUP ──────────────────────────────────────────────────────

function FDALookup() {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [selected, setSelected] = useState(null);

  const search = async () => {
    if(!query.trim()) return;
    setLoading(true); setError(null); setResults(null); setSelected(null);
    try {
      const encoded = encodeURIComponent(query.trim());
      const url = `https://api.fda.gov/drug/label.json?search=openfda.brand_name:"${encoded}"+openfda.generic_name:"${encoded}"&limit=5`;
      const res = await fetch(url);
      if(!res.ok) {
        // Try broader search
        const url2 = `https://api.fda.gov/drug/label.json?search=(openfda.brand_name:${encoded}+openfda.generic_name:${encoded})&limit=5`;
        const res2 = await fetch(url2);
        if(!res2.ok) throw new Error("No results found for that drug name.");
        const data2 = await res2.json();
        if(!data2.results||data2.results.length===0) throw new Error("No FDA label found for that drug name.");
        setResults(data2.results);
      } else {
        const data = await res.json();
        if(!data.results||data.results.length===0) throw new Error("No FDA label found for that drug name.");
        setResults(data.results);
      }
    } catch(e) {
      setError(e.message||"FDA API error. Check the drug name and try again.");
    }
    setLoading(false);
  };

  const handleKey = (e) => { if(e.key==="Enter") search(); };

  const getField = (result, ...fields) => {
    for(const f of fields) {
      if(result[f]&&result[f].length>0) return result[f][0];
    }
    return null;
  };

  const clean = (text) => {
    if(!text) return null;
    return text.replace(/\s+/g," ").trim().slice(0, 2000) + (text.length > 2000 ? "..." : "");
  };

  return (
    <div>
      <div style={{background:"#0a1a10",border:"1px solid #14532d40",borderRadius:"10px",padding:"12px 16px",marginBottom:"20px",color:"#86efac",fontSize:"0.82rem",lineHeight:1.6}}>
        🔬 Live FDA drug label lookup via openFDA public API. Search any medication by brand or generic name. Data is pulled directly from current FDA labeling.
      </div>

      <div style={{display:"flex",gap:"10px",marginBottom:"20px"}}>
        <div style={{position:"relative",flex:1}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={handleKey}
            placeholder="Enter drug name (brand or generic) — e.g. sertraline, Zoloft, lithium..."
            style={{width:"100%",background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",padding:"12px 14px",color:"#e2e8f0",fontSize:"0.875rem",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
        </div>
        <button onClick={search} disabled={loading||!query.trim()}
          style={{background:loading||!query.trim()?"#1e293b":"#0ea5e9",border:"none",color:loading||!query.trim()?"#475569":"#fff",borderRadius:"10px",padding:"12px 24px",cursor:loading||!query.trim()?"not-allowed":"pointer",fontWeight:700,fontSize:"0.875rem",fontFamily:"inherit",whiteSpace:"nowrap"}}>
          {loading?"Searching...":"Search FDA"}
        </button>
      </div>

      {error&&(
        <div style={{background:"#1a0505",border:"1px solid #7f1d1d40",borderRadius:"10px",padding:"14px 16px",color:"#f87171",fontSize:"0.83rem",marginBottom:"16px"}}>
          ⚠ {error}
        </div>
      )}

      {results&&!selected&&(
        <div>
          <div style={{color:"#475569",fontSize:"0.78rem",marginBottom:"12px"}}>{results.length} result{results.length!==1?"s":""} from FDA label database — click to view full label</div>
          {results.map((r,i)=>{
            const brand = r.openfda?.brand_name?.[0]||"—";
            const generic = r.openfda?.generic_name?.[0]||"—";
            const mfr = r.openfda?.manufacturer_name?.[0]||"—";
            const route = r.openfda?.route?.[0]||"—";
            return (
              <div key={i} onClick={()=>setSelected(r)}
                style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",padding:"14px 16px",marginBottom:"8px",cursor:"pointer",transition:"border-color 0.15s"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor="#0ea5e9"}
                onMouseLeave={e=>e.currentTarget.style.borderColor="#1e293b"}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{color:"#e2e8f0",fontWeight:700,fontSize:"0.925rem"}}>{brand}</div>
                    <div style={{color:"#64748b",fontSize:"0.78rem",marginTop:"2px"}}>{generic} · {route} · {mfr}</div>
                  </div>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#475569" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {selected&&(
        <div>
          <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"#38bdf8",cursor:"pointer",fontSize:"0.875rem",marginBottom:"20px",display:"flex",alignItems:"center",gap:"6px",padding:0}}>← Back to results</button>

          <div style={{marginBottom:"20px"}}>
            <h2 style={{color:"#e2e8f0",fontSize:"1.25rem",fontWeight:700,margin:"0 0 4px 0"}}>{selected.openfda?.brand_name?.[0]||"Unknown"}</h2>
            <div style={{color:"#64748b",fontSize:"0.82rem"}}>{selected.openfda?.generic_name?.[0]} · {selected.openfda?.route?.[0]} · {selected.openfda?.manufacturer_name?.[0]}</div>
            {selected.openfda?.application_number&&<div style={{color:"#334155",fontSize:"0.75rem",marginTop:"3px"}}>FDA Application: {selected.openfda.application_number[0]}</div>}
          </div>

          <div style={{background:"#1a0505",border:"1px solid #7f1d1d30",borderRadius:"10px",padding:"12px 16px",marginBottom:"16px",color:"#fca5a5",fontSize:"0.78rem",lineHeight:1.6}}>
            ⚠ Data sourced directly from FDA label database. Verify against current prescribing information before clinical use. Labels may not reflect the most recent REMS updates.
          </div>

          {[
            ["Indications & Usage", getField(selected,"indications_and_usage")],
            ["Dosage & Administration", getField(selected,"dosage_and_administration")],
            ["Contraindications", getField(selected,"contraindications")],
            ["Warnings & Precautions", getField(selected,"warnings_and_precautions","warnings","boxed_warning")],
            ["Adverse Reactions", getField(selected,"adverse_reactions")],
            ["Drug Interactions", getField(selected,"drug_interactions")],
            ["Use in Specific Populations", getField(selected,"use_in_specific_populations")],
            ["Mechanism of Action", getField(selected,"mechanism_of_action")],
            ["Pharmacokinetics", getField(selected,"pharmacokinetics")],
          ].filter(([,val])=>val).map(([label, val])=>(
            <div key={label} style={{background:"#0a0e17",border:"1px solid #1e293b",borderRadius:"10px",marginBottom:"10px",overflow:"hidden"}}>
              <div style={{padding:"12px 16px",borderBottom:"1px solid #1e293b",color:"#38bdf8",fontWeight:700,fontSize:"0.8rem",textTransform:"uppercase",letterSpacing:"0.06em"}}>{label}</div>
              <div style={{padding:"14px 16px",color:"#94a3b8",fontSize:"0.82rem",lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:"280px",overflowY:"auto"}}>
                {clean(val)}
              </div>
            </div>
          ))}
        </div>
      )}

      {!results&&!loading&&!error&&(
        <div style={{textAlign:"center",padding:"60px 20px",color:"#334155"}}>
          <div style={{fontSize:"2rem",marginBottom:"12px"}}>🔬</div>
          <div style={{color:"#475569",fontSize:"0.875rem",marginBottom:"6px"}}>Search any medication to pull its current FDA label</div>
          <div style={{color:"#334155",fontSize:"0.78rem"}}>Brand names, generic names, and combinations supported</div>
        </div>
      )}
    </div>
  );
}
